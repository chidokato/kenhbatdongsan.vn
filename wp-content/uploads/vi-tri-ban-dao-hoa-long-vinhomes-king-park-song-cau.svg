	<ellipse cx="390" cy="315" rx="95" ry="42" fill="#38BDF8" opacity="0.75"/>
	<ellipse cx="555" cy="335" rx="65" ry="30" fill="#22C55E" opacity="0.9"/>
	<!-- Golden Location Pin Center -->
	<circle cx="450" cy="285" r="34" fill="#E5C158" opacity="0.28"/>
	<circle cx="450" cy="285" r="14" fill="#E5C158" stroke="#FFFFFF" stroke-width="3"/>
	<!-- Highway Connections -->
	<path d="M 80 510 L 360 360 L 790 480" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="10,8" opacity="0.8"/>
