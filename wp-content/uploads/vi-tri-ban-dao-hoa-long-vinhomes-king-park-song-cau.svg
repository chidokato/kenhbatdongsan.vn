<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
	<defs>
		<linearGradient id="locBg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0B2C4D"/>
			<stop offset="100%" stop-color="#1E4E79"/>
		</linearGradient>
		<linearGradient id="cauRiver" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#0284C7"/>
			<stop offset="50%" stop-color="#38BDF8"/>
			<stop offset="100%" stop-color="#0369A1"/>
		</linearGradient>
	</defs>
	<rect width="900" height="560" fill="url(#locBg)"/>
	<!-- Grid Lines -->
	<g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
		<line x1="0" y1="110" x2="900" y2="110"/>
		<line x1="0" y1="220" x2="900" y2="220"/>
		<line x1="0" y1="330" x2="900" y2="330"/>
		<line x1="0" y1="440" x2="900" y2="440"/>
		<line x1="180" y1="0" x2="180" y2="560"/>
		<line x1="360" y1="0" x2="360" y2="560"/>
		<line x1="540" y1="0" x2="540" y2="560"/>
		<line x1="720" y1="0" x2="720" y2="560"/>
	</g>
	<!-- Cau River Embracing North of Peninsula -->
	<path d="M -20 260 Q 240 60 470 110 Q 690 155 920 85" fill="none" stroke="url(#cauRiver)" stroke-width="54" stroke-linecap="round" opacity="0.85"/>
	<!-- Hoa Long Green Peninsula (268.8ha) -->
	<path d="M 160 320 Q 290 145 480 175 Q 660 205 740 350 Q 620 460 430 465 Q 240 470 160 320 Z" fill="#15803D" opacity="0.85" stroke="#E5C158" stroke-width="3"/>
